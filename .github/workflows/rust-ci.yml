name: Rust CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: warn

jobs:
  ci:
    name: Build · Test · Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy — deny warnings
        run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          # Suppress env var warnings during clippy — test env has no .env file
          RUST_LOG: error

      - name: Build release binary
        run: cargo build --release

      - name: Run tests
        run: cargo test --all -- --test-threads=4
        env:
          # Provide valid default env vars so config tests pass
          # without a .env file in CI
          SERVER_PORT: "8080"
          WORKER_COUNT: "2"
          WORKER_TICK_MS: "50"
          STALE_CLAIM_TIMEOUT_MS: "500"
          RELAXATION_STAGE_1_MS: "5000"
          RELAXATION_STAGE_2_MS: "15000"
          RELAXATION_STAGE_3_MS: "30000"
          RELAXATION_STAGE_4_MS: "60000"
          RELAXATION_STAGE_1_DELTA: "50"
          RELAXATION_STAGE_2_DELTA: "100"
          RELAXATION_STAGE_3_DELTA: "200"
          RELAXATION_STAGE_4_DELTA: "400"
          RELAXATION_STAGE_5_DELTA: "9999"